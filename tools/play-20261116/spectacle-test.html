<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スペクタクル技法テスト T01/T05/T09/T17</title>
<style>
  :root{
    --dur-1:3000ms; --dur-2:2000ms; --dur-3:1100ms; --dur-4:700ms; --dur-5:450ms;
    --glow: 18px;
    --hue-speed: 2.4s;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:32px;background:#07070a;color:#fff;
    font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;
    display:grid;grid-template-columns:1fr 1fr;gap:28px;min-height:100vh;
  }
  h2{font-size:14px;letter-spacing:.2em;color:#9aa;margin:0 0 10px;font-weight:600}
  .cell{background:#0d0d12;border:1px solid #1d1d28;border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:220px}

  /* ---- T01: 回転する conic-gradient の虹リング ---- */
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .ring{
    width:150px;height:150px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #07070a 0 52%, transparent 53%),
      conic-gradient(from var(--angle), #ff004c, #ffd400, #00e676, #00b0ff, #7c4dff, #ff004c);
    animation: turn 3s linear infinite;
    filter: drop-shadow(0 0 18px #ff2e97);
  }
  @keyframes turn{ to{ --angle:360deg } }

  /* ---- T05: 多層 shadow の発光文字 ---- */
  .glow-text{
    font-size:44px;font-weight:900;letter-spacing:.08em;
    color:#fff;
    text-shadow:
      0 0 4px #fff,
      0 0 10px #ff2e97,
      0 0 20px #ff2e97,
      0 0 40px #b300ff,
      0 0 80px #b300ff;
    animation: pulse 2s ease-in-out infinite alternate;
  }
  @keyframes pulse{ from{ filter:brightness(1) } to{ filter:brightness(1.35) saturate(1.2) } }

  /* ---- T09: 白フラッシュ（1秒3回未満）+ 明度脈動 ---- */
  .flash-wrap{position:relative;width:100%;height:120px;overflow:hidden;border-radius:10px;background:#101018;display:grid;place-items:center}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 2400ms steps(1,end) infinite}
  @keyframes flash{ 0%,86%{opacity:0} 88%{opacity:.85} 90%{opacity:.15} 92%{opacity:.7} 95%{opacity:0} }
  .big{font-size:34px;font-weight:900;letter-spacing:.12em;color:#ffe14d;text-shadow:0 0 18px #ff8a00,0 0 40px #ff2e97}

  /* ---- T17: 強度 1〜5 の離散切替 ---- */
  .bars{display:flex;gap:6px;align-items:flex-end;height:110px}
  .bar{width:22px;border-radius:4px;background:linear-gradient(#00e5ff,#7c4dff);
        animation:jump var(--dur) linear infinite alternate}
  .bar:nth-child(1){--dur:var(--dur-1)}
  .bar:nth-child(2){--dur:var(--dur-2)}
  .bar:nth-child(3){--dur:var(--dur-3)}
  .bar:nth-child(4){--dur:var(--dur-4)}
  .bar:nth-child(5){--dur:var(--dur-5);background:linear-gradient(#ffd400,#ff004c)}
  @keyframes jump{ from{height:18px} to{height:100px} }

  .lv{display:flex;gap:10px;margin-top:6px}
  .lv b{font-size:11px;color:#889;letter-spacing:.15em}
</style>
</head>
<body>
  <div class="cell">
    <h2>T01 回転 conic の虹リング</h2>
    <div class="ring" id="ring"></div>
  </div>

  <div class="cell">
    <h2>T05 多層 shadow の発光文字</h2>
    <div class="glow-text" id="glow">ドパガキ</div>
  </div>

  <div class="cell">
    <h2>T09 白フラッシュ（2.4s 周期）</h2>
    <div class="flash-wrap">
      <div class="flash"></div>
      <div class="big" id="big">大当り</div>
    </div>
  </div>

  <div class="cell">
    <h2>T17 強度1〜5の離散切替</h2>
    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>
    <div class="lv"><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b></div>
  </div>
</body>
</html>
